services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://opnnotes:${POSTGRES_PASSWORD:-opnnotes}@postgres:5432/opnnotes
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"

  tests:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://opnnotes:${POSTGRES_PASSWORD:-opnnotes}@postgres:5432/opnnotes

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: opnnotes
      POSTGRES_USER: opnnotes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opnnotes}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
